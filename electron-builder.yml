appId: com.ig.app
productName: ig
directories:
  output: release
publish:
  - provider: github
    owner: ishenli
    repo: investment-agent
    releaseType: release
files:
  - dist-electron/**/*
  - node_modules/@libsql/**/* # 必须包含，否则 asarUnpack 没东西可抽离
  - "!node_modules"
  - "!src"
  - "!electron"
  - "!.next"
  - "!build"
  - "!scripts"
  - "!docs"
  - "!release"
  - "!data"
  - "!website"
extraResources:
  - from: .next/standalone/
    to: standalone/
    filter:
      - "**/*"
      - "!node_modules"
      - "!release"
      - "!dist-electron"
      - "!bin"
      - "!drizzle"
      - "!logs"
      - "!electron"
      - "!build"
      - "!data_cache"
      - "!src"
      - "!openspec"
      - "!public"
      - "!run"
      - "!docs"
      - "!report"
      - "!tests"
      - "!scripts"
      - "!tsconfig.tsbuildinfo"
      - "!pnpm-lock.yaml"
      - "!pnpm-workspace.yaml"
      - "!sqlite.db"
      - "!.git"
  - from: .next/standalone/node_modules/
    to: standalone/node_modules/
    filter: ["**/*"]
  - from: .next/standalone/.next/
    to: standalone/.next/
    filter: ["**/*"]
  - from: .next/static/
    to: standalone/.next/static/
    filter: ["**/*"]
  - from: public/
    to: standalone/public/
    filter: ["**/*"]
  - from: build/
    to: .
    filter: ["icon.*"]
  - from: build/icon.png
    to: icon.png
  - from: "drizzle"
    to: "standalone/drizzle"
  - from: "skills"
    to: "standalone/skills"
asarUnpack:
  - "**/*.node"
  - "**/@libsql/**"
  - resources/**
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  notarize: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: build/icon.png
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
  desktop:
    entry:
      Name: ig
      Comment: A Investment Agent
      Categories: Development;IDE;
      StartupWMClass: ig
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]