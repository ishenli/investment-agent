name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ 先装 pnpm（必须在 cache 之前）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # 2️⃣ 再装 Node + cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4️⃣ 检查数据库迁移
      - name: Check database migrations
        run: |
          # 创建临时数据库并执行迁移
          INVESTMENT_AGENT_DATA_DIR=./ pnpm db:migrate
          # 验证迁移后的 schema 与当前定义一致
          INVESTMENT_AGENT_DATA_DIR=./ pnpm drizzle-kit push --force
        env:
          NODE_ENV: test

      # 5️⃣ 类型检查
      - name: Run type checking
        run: pnpm types:check

      # 6️⃣ 测试
      - name: Run tests
        run: pnpm test
